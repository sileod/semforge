[project]
name = "semforge"
version = "0.1.0"
readme = "README.md"
license = {text = "Apache-2.0"}
description = "A certified sampler of logical reasoning problems: synthetic data with checked proof structure"
keywords = ["synthetic data", "data generation", "sampler", "logical reasoning", "natural language inference",
            "proof", "theorem proving", "LLM training", "reasoning benchmark", "dataset audit", "z3"]
requires-python = ">=3.10"
dependencies = ["z3-solver"]

[project.optional-dependencies]
bench = ["scikit-learn", "numpy", "sympy"]
linear = ["sympy"]
test = ["pytest", "sympy", "numpy"]
audit = ["datasets"]                  # FLD×2 / ZebraLogic adapters (Hub data)
transfer = ["datasets", "tasknet"]    # semforge.pipeline.transfer (torch, transformers via tasknet)
train = ["torch", "transformers", "peft", "datasets", "numpy", "scipy"]  # experiments/ training runs
llm = ["litlm"]                       # LLM error analysis through hosted models

[tool.setuptools.packages.find]
include = ["semforge*"]
